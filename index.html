 HC.forEach((L,sc)=>L.forEach(([r,c])=>g[r][c].bg=MC[sc]+'cc'));FN.forEach(([r,c],sc)=>g[r][c].bg=MC[sc]);g[7][7].bg='#fbbf24';[[6,6],[6,8],[8,6],[8,8]].forEach(([r,c])=>g[r][c].bg='#d6c79a');return g})();
const mCell=(sc,rp,i)=>rp<0?YS[sc][i]:rp<=50?TRK[(13*sc+rp)%52]:rp<=55?HC[sc][rp-51]:FN[sc];
const menchGuide=(show,id)=>`<details class="guide" id="${id}" style="${show?'':'display:none'}" open><summary>📖 منچ چطور است؟</summary><ol><li>هر نفر ۴ مهره دارد. هدف: همه‌ی مهره‌ها را به خانه‌ی وسط برسان.</li><li>برای بیرون آوردن مهره از خانه‌ی اول باید ۶ بیاوری.</li><li>۶ آوردی یا مهره‌ی حریف را زدی؟ دوباره تاس می‌ریزی (سه ۶ پشت‌هم: نوبتت می‌سوزد).</li><li>روی مهره‌ی حریف بیفتی، او به خانه‌ی اولش برمی‌گردد؛ ولی روی خانه‌ی ستاره‌دار و خانه‌ی شروع رنگی امن است.</li><li>برای ورود به مقصد باید دقیقاً همان عدد لازم را بیاوری.</li></ol></details>`;
function pickG(g){GT=g;['mono','mench'].forEach(x=>{const e=$('g-'+x);if(e)e.className='gp'+(x==g?' sel':'')});const a=$('gd1'),b=$('gd2');if(a)a.style.display=g=='mono'?'':'none';if(b)b.style.display=g=='mench'?'':'none'}
function mStart(){const n=S.p.length;S.p.forEach((p,k)=>p.sc=n==2?[0,2][k]:k);S.pc=S.p.map(()=>[-1,-1,-1,-1]);S.t=rnd(n);S.ph='roll';S.dd=0;S.rv=0;S.sx=0;S.mm=[];S.cx=0;S.lm=null;lg('🔴 بازی منچ شروع شد')}
const mLegal=(k,d)=>{const a=S.pc[k],ms=a.map((rp,i)=>rp<0?(d==6?i:-1):(rp+d<=56?i:-1)).filter(i=>i>=0);return ms.filter((i,j)=>ms.findIndex(x=>a[x]==a[i])==j)};
function mNext(){S.sx=0;S.mm=[];S.t=(S.t+1)%S.p.length;S.ph='roll'}
function mDo(i){const k=S.t,P=S.p[k],a=S.pc[k],rp=a[i],d=S.dd,nr=rp<0?0:rp+d;a[i]=nr;S.lm=[k,i];let bonus=d==6;
 if(nr<=50){const ab=(13*P.sc+nr)%52;if(ab%13!=0&&ab%13!=8)S.p.forEach((q,j)=>{if(j==k)return;S.pc[j].forEach((r2,x)=>{if(r2>=0&&r2<=50&&(13*q.sc+r2)%52==ab){S.pc[j][x]=-1;S.cx=(S.cx||0)+1;bonus=true;lg('💥 '+P.n+' مهره‌ی '+q.n+' را زد!')}})})}
 if(nr==56){bonus=true;lg('🏁 '+P.n+' یک مهره را به مقصد رساند')}
 if(a.every(x=>x==56)){S.ph='over';S.w=k;S.mm=[];lg('🏆 '+P.n+' برنده شد');return}
 S.mm=[];if(bonus)S.ph='roll';else mNext()}
ACT.mroll=()=>{if(S.ph!='roll')return;const k=S.t,d=1+rnd(6);S.dd=d;S.rv=(S.rv||0)+1;S.lm=null;
 if(d==6){S.sx=(S.sx||0)+1;if(S.sx>=3){lg(S.p[k].n+' سه ۶ پشت‌هم آورد؛ نوبتش می‌سوزد');return mNext()}}else S.sx=0;
 const ms=mLegal(k,d);if(!ms.length){lg(S.p[k].n+' '+d+' آورد؛ حرکتی ندارد');return mNext()}
 S.mm=ms;if(ms.length==1)return mDo(ms[0]);S.ph='move'};
ACT.mmv=i=>{if(S.ph=='move'&&S.mm.includes(i))mDo(i)};
function mDanger(k,nr){if(nr<0||nr>50)return 0;const ab=(13*S.p[k].sc+nr)%52;if(ab%13==0||ab%13==8)return 0;let t=0;S.p.forEach((q,j)=>{if(j==k)return;S.pc[j].forEach(r2=>{if(r2>=0&&r2<=50){const dd=(ab-(13*q.sc+r2)%52+52)%52;if(dd>=1&&dd<=6&&r2+dd<=50)t++}})});return t}
function mPick(k){const a=S.pc[k],d=S.dd;let best=S.mm[0],bs=-1e9;for(const i of S.mm){const rp=a[i],nr=rp<0?0:rp+d;let sc=nr*.4+Math.random()*3;
 if(nr<=50){const ab=(13*S.p[k].sc+nr)%52;if(ab%13!=0&&ab%13!=8)S.p.forEach((q,j)=>{if(j!=k)S.pc[j].forEach(r2=>{if(r2>=0&&r2<=50&&(13*q.sc+r2)%52==ab)sc+=100+r2})});else sc+=18}
 if(nr==56)sc+=90;else if(nr>50)sc+=35;if(rp<0)sc+=55;sc+=mDanger(k,rp)*28-mDanger(k,nr)*32;if(sc>bs){bs=sc;best=i}}return best}
function mBot(){clearTimeout(MT);if(!S||S.g!='mench'||S.ph=='lobby'||S.ph=='over')return;const p=S.p[S.t];if(!p.bot)return;const h=S.p.find(q=>!q.bot);if(!(local||(h&&h.id==ID)))return;
 MT=setTimeout(()=>{if(!S||S.ph=='over'||!S.p[S.t].bot)return;if(S.ph=='roll')A('mroll');else if(S.ph=='move')A('mmv',mPick(S.t))},[0,900,450,150][SPD])}
const MD=['#991b1b','#166534','#a16207','#1e40af'],ML=['#fecaca','#bbf7d0','#fef08a','#bfdbfe'];
let MDP=null,MBZ=0,MQ=[],MTM=0;
const mxy=(sc,rp,i)=>{const[r,c]=mCell(sc,rp,i);return[(c+.5)*100/15,(r+.5)*100/15,r*15+c]};
function mPlace(){const g={};S.p.forEach((p,k)=>MDP[k].forEach((rp,i)=>{const[x,y,key]=mxy(p.sc,rp,i);(g[key]=g[key]||[]).push([k,i,x,y])}));
 for(const key in g){const L=g[key],n=L.length;L.forEach(([k,i,x,y],m)=>{const e=document.getElementById('pw'+k+'_'+i);if(!e)return;e.style.left=(x+(m-(n-1)/2)*2.4)+'%';e.style.top=(y+(n>1?(m%2?.7:-.7):0))+'%';e.style.zIndex=Math.round(y*10)+m;e.style.setProperty('--sz',n>1?'.82':'1')})}}
function mDiff(){const q=[];S.p.forEach((p,k)=>S.pc[k].forEach((rp,i)=>{const d=MDP[k][i];if(d===rp)return;if(rp<0)q.push({k,i,rp:-1,cap:1,sc:p.sc,from:d});else if(d<0||rp-d>12||rp<d)q.push({k,i,rp});else for(let r=d+1;r<=rp;r++)q.push({k,i,rp:r})}));return q.filter(x=>!x.cap).concat(q.filter(x=>x.cap))}
function mBoom(sc,rp,i){const[x,y]=mxy(sc,rp,i),l=document.getElementById('mpl');if(!l)return;const e=document.createElement('div');e.className='boom';e.textContent='💥';e.style.left=x+'%';e.style.top=y+'%';l.appendChild(e);setTimeout(()=>e.remove(),700)}
function mRun(){const st=[0,170,110,60][SPD];if(!MQ.length){MBZ=0;mRender();return}
 const m=MQ.shift();if(m.cap)mBoom(m.sc,m.from,m.i);MDP[m.k][m.i]=m.rp;const e=document.getElementById('pw'+m.k+'_'+m.i);
 if(e){e.style.setProperty('--st',(m.cap?.45:st/1000)+'s');e.classList.remove('hp');void e.offsetWidth;if(!m.cap)e.classList.add('hp')}
 mPlace();if(m.cap)snd('pay');else tn(520+(m.rp%8)*40,.07,'triangle',.1,0);MTM=setTimeout(mRun,m.cap?520:st+12)}
const mf=n=>`<div class="cf f${n}">`+PIP[n].map(c=>`<i style="grid-area:${Math.ceil(c/3)}/${(c-1)%3+1}"></i>`).join('')+'</div>';
const MROT={1:'rotateX(0deg) rotateY(0deg)',2:'rotateY(-90deg)',3:'rotateX(-90deg)',4:'rotateX(90deg)',5:'rotateY(90deg)',6:'rotateY(180deg)'};
function mRender(){if(MBZ&&Date.now()-MBZ<9000)return;MBZ=0;
 const app=$('app'),over=S.ph=='over',lob=S.ph=='lobby',mi=local?S.t:S.p.findIndex(p=>p.id==ID),cp=S.p[S.t];
 if(lob)MDP=null;else if(!MDP||MDP.length!=S.p.length)MDP=S.pc.map(a=>a.slice());
 const dq=lob?[]:mDiff(),busy=dq.length>0,mine=!over&&!lob&&!!cp&&!cp.bot&&(local||cp.id==ID)&&!busy,rolled=!!MPV&&!lob&&S.rv!==MPV.rv;
 if(MPV&&!lob){if(rolled)snd('dice');if(mine&&(!MPV.mine||MPV.t!==S.t))snd('turn')}
 let h=`<div class="top"><div class="logo">🔴 منچ</div><button class="b s" onclick="tgs()">${['','🐢 عادی','⏩ سریع','⚡ فوری'][SPD]}</button><button class="b s" onclick="mute()">${MUTE?'🔇':'🔊'}</button>${CT.el?`<button id="cbt" class="b s" onclick="chatTg()">💬<i id="cbd" style="display:${CT.n?'block':'none'}">${CT.n||''}</i></button>`:''}<div class="code">کد بازی <b>${code}</b> ${local?'(یک‌دستگاهی)':''}</div></div>`;
 h+=`<div class="pcs">${S.p.map((p,k)=>{const sc=p.sc===undefined?k:p.sc,fin=lob?0:S.pc[k].filter(x=>x==56).length;return`<div class="pc${!lob&&k==S.t&&!over?' on':''}" style="border-color:${MC[sc]}"><span class="av" style="background:${MC[sc]}">${p.bot?'🤖':p.n[0]}</span><span>${p.n}${k==mi?' (تو)':''}${lob?'':'<br><span class="cash">🏁 '+fin+'/۴</span>'}</span></div>`}).join('')}</div>`;
 if(lob){h+=`<div class="box"><b>در انتظار بازیکنان…</b> (۲ تا ۴ نفر)<br>کد بازی را به دوستت بده: <b class="bigcode">${code}</b><br>${local?'<input id="n" placeholder="اسم بازیکن"> '+bt('افزودن','addpp'):''}${(local||S.p[0].id==ID)?bt('🤖 افزودن ربات','addb',0,S.p.length>=4):''}${(local||S.p[0].id==ID)?bt('شروع بازی','start',0,S.p.length<2):'منتظر باش تا سازنده بازی را شروع کند'}</div>`+menchGuide(true,'gd3');app.innerHTML=h;MPV=null;return}
 const used=S.p.map(p=>p.sc),cs=cp?cp.sc:-1;
 let b='<div id="mbw"><div id="mb">';
 for(let q=0;q<4;q++){const r0=q<2?1:10,c0=(q==0||q==3)?1:10;b+=`<div class="yd${q==cs&&!over?' on':''}${used.includes(q)?'':' off'}" style="grid-area:${r0}/${c0}/${r0+6}/${c0+6};--c:${MC[q]};--d:${MD[q]};--l:${ML[q]}"></div>`}
 TRK.forEach(([r,c],i)=>{const st=i%13==0,sr=i%13==8;b+=`<div class="tc${st?' ts':''}" style="grid-area:${r+1}/${c+1};${st?`--c:${MC[i/13]};--d:${MD[i/13]}`:''}">${st?`<b class="arw" style="transform:rotate(${i/13*90}deg)">➤</b>`:''}${sr?'<b class="str">★</b>':''}</div>`});
 HC.forEach((L,q)=>L.forEach(([r,c])=>b+=`<div class="hcl" style="grid-area:${r+1}/${c+1};--c:${MC[q]};--d:${MD[q]}"></div>`));
 b+='<div class="ctr" style="grid-area:7/7/10/10"></div><div id="mpl">';
 YS.forEach((L,q)=>L.forEach(([r,c])=>b+=`<i class="slot" style="left:${(c+.5)*100/15}%;top:${(r+.5)*100/15}%;--c:${MC[q]};--d:${MD[q]}"></i>`));
 S.p.forEach((p,k)=>S.pc[k].forEach((_,i)=>{const mv=mine&&S.ph=='move'&&k==S.t&&S.mm.includes(i);b+=`<div id="pw${k}_${i}" class="pw nt${mv?' mvb':''}" style="--c:${MC[p.sc]};--d:${MD[p.sc]};--l:${ML[p.sc]}"${mv?` onclick="A('mmv',${i})"`:''}><b class="pb"></b><b class="pt"></b><b class="ph"></b></div>`}));
 b+='</div></div></div>';h+=b;
 const roll=mine&&S.ph=='roll',c=over?`🏆 برنده: <b>${S.p[S.w].n}</b>`:`نوبت <b style="color:${MC[cp.sc]}">${cp.n}</b>: `+(busy?'🚶 مهره در حال حرکت…':!mine?'در حال بازی…':roll?bt('🎲 تاس بریز','mroll'):'👆 روی یکی از مهره‌های پرنور بزن'),
 tp=mine?(roll?'🎲 تاس بریز (یا روی تاس بزن)؛ ۶ بیاوری مهره بیرون می‌آید و دوباره می‌ریزی':'👆 مهره‌های دارای حلقه‌ی زرد را می‌توانی حرکت بدهی'):'';
 h+=`<div class="box act${mine?' mine':''}">${tp?'<div class="tip">'+tp+'</div>':''}<div class="mrow"><div class="cw"${roll?` onclick="A('mroll')"`:''}><div class="cube${rolled?' rl3':''}" style="transform:${MROT[S.dd||1]}">${[1,2,3,4,5,6].map(mf).join('')}</div></div><div>${c}</div></div></div><div class="box"><div class="lg">${S.log.slice(0,3).map(x=>`<div>${x}</div>`).join('')}</div></div>`;
 if(over&&!busy)h+=`<div class="ov"><div class="dlg"><div class="win">🏆</div><div class="ask">${S.p[S.w].n} برنده شد!</div><button class="b" onclick="location.reload()">بازی تازه</button></div></div>`;
 app.innerHTML=h;mPlace();void app.offsetWidth;document.querySelectorAll('.pw.nt').forEach(e=>e.classList.remove('nt'));
 MPV={rv:S.rv,t:S.t,mine};
 if(busy){MQ=dq;MBZ=Date.now();clearTimeout(MTM);MTM=setTimeout(mRun,rolled?800:80);return}
 mBot()}
const _A=A;window.A=(k,x)=>{if(k=='mkk')return mk();if(k=='jnn')return jn();if(k=='addpp')return addp();if(k=='trade')return tbOpen();if(k=='tsend')return tbSend();if(k=='tclose'){TB=null;return render()}if(k=='fin'){if(!FC||Date.now()-FC>4000){FC=Date.now();return toast('برای پایان بازی دوباره بزن')}FC=0}_A(k,x)};
render();
</script></body></html>
